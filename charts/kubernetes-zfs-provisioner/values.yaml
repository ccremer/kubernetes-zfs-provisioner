# Default values for kubernetes-zfs-provisioner.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- 1 is enough (leader election). Use 2 for HA together with a PDB.
replicaCount: 1

image:
  # -- Location of the container image
  repository: ccremer/zfs-provisioner
  # -- Container image registry
  registry: ghcr.io
  # -- Pin an exact release tag so the chart maps 1:1 to a known image build.
  tag: v1.6.0
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

provisioner:
  # -- Provisoner instance name if multiple are running (multiple
  # instances are not required for managing multiple ZFS hosts)
  instance: pv.kubernetes.io/zfs

storageClass:
  # -- Whether to create storage classes for this provisioner.
  create: false
  # -- Storage classes to create. See [values.yaml](values.yaml) for an example.
  classes: []
    # - name: zfs
    #   # -- The provisioners connects through SSH to this ZFS host
    #   hostName: storage-1.domain.tld
    #   # -- Existing dataset on the target ZFS host
    #   parentDataset: tank/kubernetes
    #   # -- The reclaim policy supported by the provisioner
    #   policy: "Delete"
    #   # -- NFS export properties (see `exports(5)`)
    #   shareProperties: ""
    #   # -- Provision type, one of [`nfs`, `hostpath`, `auto`]
    #   type: "nfs"
    #   # -- Override `kubernetes.io/hostname` from `hostName` parameter for
    #   # `HostPath` node affinity
    #   node: ""
    #   # -- Reserve space for created datasets. Default is true. Use false to enable thin provisioning
    #   reserveSpace: false
    #   # -- If false, Delete refuses to run while user snapshots exist
    #   destroySnapshots: true
    #   allowVolumeExpansion: true
    #   volumeBindingMode: Immediate
    #   mountOptions:
    #     - nfsvers=4.2
    #     - proto=tcp
    #     - hard
    #   # -- Annotations for the storage class
    #   # annotations:
    #   #   storageclass.kubernetes.io/is-default-class: "true"

ssh:
  # -- If SSH secrets are managed externally, specify the name
  externalSecretName: ""
  # -- The path where the SSH config and identities are mounted
  mountPath: "/home/zfs/.ssh"
  # -- Optional ssh_config(5). Only `User` and `Port` are honoured by the native client.
  # Per-host IdentityFile is not read; set `ZFS_SSH_KEY` or use a standard key name.
  config: ""
    # config: |
    #   Host my-host
    #     User zfs
    #     Port 22

  # -- **Required.** Provide a private key for each SSH identity.
  # See [values.yaml](./values.yaml) for an example
  identities: {}
#   id_ed25519: |
#     -----BEGIN OPENSSH PRIVATE KEY-----
#     ...
#     -----END OPENSSH PRIVATE KEY-----

  # -- **Required** unless `env.ZFS_SSH_HOSTKEY_TOFU` is `"true"`. List of {host, pubKey} dicts
  # with the public key of each ZFS host. Host keys are verified strictly by default; set
  # `env.ZFS_SSH_HOSTKEY_TOFU: "true"` to pin unknown host keys on first use instead.
  knownHosts: []
#   - host: my-host
#     pubKey: ssh-ed25519 AAAAC3NzaC...

# -- A dict with KEY: VALUE pairs passed to the provisioner as environment variables.
# Use it to tune the SSH connection, e.g. `ZFS_SSH_HOSTKEY_TOFU: "true"` or `ZFS_SSH_PORT: "2222"`.
# See the [provisioner README](https://github.com/ccremer/kubernetes-zfs-provisioner#ssh-connection) for the full list.
env: {}

# -- A dict with `{ip, hostnames array}` to configure custom entries in /etc/hosts.
# See [values.yaml](./values.yaml) for an example.
hostAliases: {}
#  192.168.1.1:
#    - my-custom-host.name

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

rbac:
  # -- Grant the service account the necessary cluster permissions.
  create: true

# -- If you encounter **issues with SSH, set `podSecurityContext.fsGroup=100`**, as the SSH
# files might not be readable to the container user `zfs` with uid 100.
podSecurityContext:
  fsGroup: 100

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 100

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

metrics:
  port: 8080
  service:
    # -- Expose /metrics on a ClusterIP Service
    enabled: true

podDisruptionBudget:
  enabled: true
  # -- Minimum available replicas. Ignored when replicaCount equals 1, since the PDB is only rendered for replicaCount greater than 1.
  minAvailable: 1

# -- Optional PriorityClass for the provisioner pod
priorityClassName: ""

# -- Reminder: This has no effect on any PVs, but maybe you want the provisioner pod running
# on certain nodes.
nodeSelector: {}

tolerations: []

affinity: {}

# -- Extra volumes mounted into the provisioner container (e.g. local mock root)
extraVolumes: []
# -- Extra volume mounts for the provisioner container
extraVolumeMounts: []
